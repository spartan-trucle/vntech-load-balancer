<script src="js/vendor/qrcode.js"></script>
<script>
// Sections are fetched, so the deck needs HTTP (GitHub Pages or a local server), not file://.
// Order here is slide order. Each section's inline <script> (its charts) runs after all
// slides are in the DOM and before deck.js counts data-step reveals.
(async () => {
  // Cache-bust the shared scripts too: a stale charts-lib.js breaks every animated slide after an edit.
  const load = (src) => new Promise((ok, fail) => {
    const s = document.createElement('script');
    s.src = `${src}?v=${Date.now()}`;
    s.onload = ok;
    s.onerror = () => fail(new Error(`${src} failed to load`));
    document.body.appendChild(s);
  });
  await load('js/charts-lib.js');
  await load('js/backdrop.js');
  const SECTIONS = [
    '00-cover',
    '00-outline',
    '00-introduction',
    '01-local-load-balancing',
    '02-global-load-balancing',
    '03-algorithms',
    '04-demo',
    '99-thanks',
  ];
  // Cache-bust the stylesheet too: a cached deck.css leaves new slides (e.g. the outline) unstyled.
  document.querySelector('link[href="css/deck.css"]').href = `css/deck.css?v=${Date.now()}`;
  const deck = document.getElementById('deck');
  const htmls = await Promise.all(SECTIONS.map((n) =>
    fetch(`sections/${n}.html`, { cache: 'no-cache' }).then((r) => {
      if (!r.ok) throw new Error(`sections/${n}.html: HTTP ${r.status}`);
      return r.text();
    })));
  const scripts = [];
  htmls.forEach((html) => {
    const tpl = document.createElement('template');
    tpl.innerHTML = html;
    tpl.content.querySelectorAll('script').forEach((s) => { scripts.push(s.textContent); s.remove(); });
    deck.appendChild(tpl.content);
  });
  scripts.forEach((code) => {
    const s = document.createElement('script');
    s.textContent = code;
    document.body.appendChild(s);
  });
  const engine = document.createElement('script');
  // Cache-bust: without this, browsers keep running a stale deck.js after edits.
  engine.src = `js/deck.js?v=${Date.now()}`;
  document.body.appendChild(engine);
})().catch((err) => {
  const hint = location.protocol === 'file:'
    ? 'This page was opened as a file. Serve the folder over HTTP instead: <code>cd presentation &amp;&amp; python3 -m http.server</code>, then open <code>http://localhost:8000</code>.'
    : 'Check that the file exists and the name matches the SECTIONS list in index.html.';
  document.getElementById('deck').innerHTML =
    `<p style="padding:2rem;color:var(--ink, #eee)">Failed to load slides: ${err.message}.<br>${hint}</p>`;
});
</script>
