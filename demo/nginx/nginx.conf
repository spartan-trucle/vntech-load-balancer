# NGINX for the demo. Started by `npm run up` with -p demo/.run/, so relative paths
# (pid, logs, temp) land in demo/.run/. The algorithm lives in generated/*.conf,
# written by `npm run algo -- <rr|weight|least|iphash>`.
worker_processes 1;
pid nginx.pid;

events {}

http {
  access_log logs/access.log;
  client_body_temp_path temp/body;
  proxy_temp_path temp/proxy;
  fastcgi_temp_path temp/fastcgi;
  uwsgi_temp_path temp/uwsgi;
  scgi_temp_path temp/scgi;

  include generated/algorithm.conf;   # map → $lb_algorithm, e.g. "least_conn"

  upstream backend {
    include generated/upstream.conf;  # e.g. least_conn; server 127.0.0.1:8001; ...
    # defaults, written out for the slide: 1 failure takes a server out for 10 s
    # (max_fails=1 fail_timeout=10s on every server line)
  }

  server {
    listen 8000;

    # The deck is served from another port, so every response carries CORS headers.
    # add_header is not inherited once a location sets its own, so both locations repeat them.

    # Cheap status probe for the slide: which algorithm is live. Not proxied, so it
    # doesn't move the round robin counter.
    location = /__lb {
      add_header Access-Control-Allow-Origin * always;
      add_header Access-Control-Expose-Headers "X-LB" always;
      add_header X-LB $lb_algorithm always;
      add_header Cache-Control no-store always;
      return 204;
    }

    location / {
      proxy_pass http://backend;
      proxy_buffering off;  # pass the backend's early headers straight through
      # backends send their own CORS header for /__health; drop it here so the browser
      # doesn't see two Access-Control-Allow-Origin values and reject the response
      proxy_hide_header Access-Control-Allow-Origin;
      # retry the next server on a refused connection (this is also the default)
      proxy_next_upstream error timeout;

      add_header Access-Control-Allow-Origin * always;
      add_header Access-Control-Expose-Headers "X-Upstream, X-LB" always;
      # every server NGINX tried, in order: "127.0.0.1:8002, 127.0.0.1:8003" after a crash
      add_header X-Upstream $upstream_addr always;
      add_header X-LB $lb_algorithm always;
      add_header Cache-Control no-store always;
    }
  }
}
